default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-yaml", args = ["--multi"], priority = 0 },
  { id = "check-json", priority = 0 },
  { id = "check-case-conflict", priority = 0 },
  { id = "check-merge-conflict", stages = ["pre-commit", "pre-push"], priority = 0 },
  { id = "mixed-line-ending", args = ["--fix=lf"], priority = 0 },
  { id = "detect-private-key", priority = 0 },
  { id = "check-added-large-files", args = ["--maxkb=500"], priority = 0 },
  { id = "no-commit-to-branch", name = "Block commits to main", args = ["--branch", "main"], stages = ["pre-commit", "pre-push"], priority = 0 },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [
  { id = "actionlint", pass_filenames = false, priority = 0 },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "ruff-format",
    name = "ruff format --check",
    entry = "uv run ruff format --check",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "codespell",
    name = "codespell",
    entry = "uv run codespell",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "rumdl-check",
    name = "rumdl check",
    entry = "uv run rumdl check",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "rumdl-fmt",
    name = "rumdl fmt --check",
    entry = "uv run rumdl fmt --check",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "mypy",
    name = "mypy",
    entry = "uv run mypy",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "pyright",
    name = "pyright",
    entry = "env PYRIGHT_PYTHON_IGNORE_WARNINGS=1 uv run pyright",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "pyright-verifytypes",
    name = "pyright --verifytypes",
    entry = "env PYRIGHT_PYTHON_IGNORE_WARNINGS=1 uv run pyright --verifytypes cuid2 --ignoreexternal",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "pytest",
    name = "pytest",
    entry = "uv run pytest",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "pytest-slow",
    name = "pytest (slow)",
    entry = "uv run pytest --no-cov -m slow",
    language = "system",
    pass_filenames = false,
    stages = ["pre-push"],
    priority = 0,
  },
  {
    id = "verify-changelog",
    name = "verify changelog",
    entry = "uv run python -m local.verify_release changelog",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "zizmor",
    name = "zizmor",
    entry = "uv run zizmor --persona=pedantic .github/workflows",
    language = "system",
    pass_filenames = false,
    priority = 0,
  },
]

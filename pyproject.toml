[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "cuid2"
version = "2.1.0"
authors = [
    {name = "Will Gordon", email = "dev@gordoncode.dev"},
]
description = "Next generation GUIDs. Collision-resistant ids optimized for horizontal scaling and performance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
keywords = ['crypt', 'security', 'uuid', 'guid', 'cuid', 'cryptography']

[project.urls]
repository = "https://github.com/gordon-code/cuid2/"
Changelog = "https://github.com/gordon-code/cuid2/blob/main/CHANGELOG.md"
Issues = "https://github.com/gordon-code/cuid2/issues"

[project.scripts]
cuid2 = "cuid2.cli:main"

[tool.uv]
default-groups = ["lint", "test", "tox", "typing"]

[dependency-groups]
lint = [
    "codespell==2.4.3",
    "ruff==0.17.0",
    "rumdl==0.3.0",
]
test = [
    "pytest==9.1.1",
    "pytest-mock==3.16.0",
    "pytest-sugar==1.1.1",
]
tox = [
    "tox==4.65.4; python_version >= '3.11'",
    "tox-uv==1.37.0; python_version >= '3.11'",
]
typing = [
    "mypy==2.4.0",
    "pyright[nodejs]==1.1.414",
]

[tool.tox]
legacy_tox_ini = """
    [tox]
    min_version = 4
    env_list = py3{10,11,12,13,14}, check
    work_dir = local/.tox
    isolated_build = True

    [testenv]
    runner = uv-venv-lock-runner
    description = run unit tests
    dependency_groups = test
    commands = pytest

    [testenv:check]
    runner = uv-venv-lock-runner
    description = run linters and typing
    package = wheel
    setenv =
        PYRIGHT_PYTHON_IGNORE_WARNINGS = 1
    dependency_groups =
        lint
        typing
        test
    commands =
        ruff check
        ruff format --check
        codespell
        rumdl check
        rumdl fmt --check
        mypy
        pyright
        pyright --verifytypes cuid2 --ignoreexternal
"""

[tool.codespell]
skip = "build,dist,hack,uv.lock"

[tool.rumdl]
cache-dir = "local/.rumdl_cache"
disable = ["MD013"]
exclude = ["hack"]

[tool.rumdl.per-file-ignores]
".github/**/*.md" = ["MD041"]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"
cache-dir = "local/.ruff_cache"
extend-exclude = ["hack"]
force-exclude = true

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["ALL"]
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D104", # Missing docstring in public package
    "D205", # Blank line required between summary line and description
    "D401", # First line should be in imperative mood
    "COM812", "ISC001", # Conflict with formatter
    "CPY001", # Missing copyright notice at top of file
    "FBT001", "FBT002", # Boolean-typed positional argument in function definition
]
# Don't automatically remove `print`
# Stop automatically removing unused imports
unfixable = ["T201", "F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# Ignore `assert` in test files (S101), magic values (PLR2004), and private member accessed (SLF001)
"test_*.py" = ["S101", "PLR2004", "SLF001"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
minversion = "8.1"
cache_dir = "local/.pytest_cache"
python_files = "test_*.py"
testpaths = ["local/tests"]

[tool.mypy]
cache_dir = "local/.mypy_cache"
files = ["."]
exclude = ["^build/", "^dist/", "^hack/"]
strict = true

[tool.pyright]
exclude = ["build", "dist", "hack"]
strict = ["src"]

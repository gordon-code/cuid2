[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "cuid2"
version = "2.2.0"
authors = [
    {name = "Will Gordon", email = "dev@gordoncode.dev"},
]
description = "Next generation GUIDs. Collision-resistant ids optimized for horizontal scaling and performance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
keywords = ['crypt', 'security', 'uuid', 'guid', 'cuid', 'cryptography']

[project.urls]
repository = "https://github.com/gordon-code/cuid2/"
Changelog = "https://github.com/gordon-code/cuid2/blob/main/CHANGELOG.md"
Issues = "https://github.com/gordon-code/cuid2/issues"

[project.scripts]
cuid2 = "cuid2.cli:main"

[tool.uv]
default-groups = ["build", "lint", "test", "typing"]

[dependency-groups]
build = [
    "twine==7.0.0",
]
lint = [
    "codespell==2.4.3",
    "prek==0.5.7",
    "ruff==0.17.0",
    "rumdl==0.3.0",
    "zizmor==1.31.1; python_version >= '3.11'",
]
test = [
    "coverage[toml]==7.16.2",
    "hypothesis==6.168.5; python_version < '3.11'",
    "hypothesis==6.170.5; python_version >= '3.11'",
    "keepachangelog==2.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.16.0",
]
typing = [
    "mypy==2.4.0",
    "pyright[nodejs]==1.1.414",
]

[tool.codespell]
check-hidden = ""
ignore-words-list = "intoto"
skip = ".cache,.claude,.coverage,.coverage.*,.git,.hypothesis,.mypy_cache,.pdm-build,.pytest_cache,.ruff_cache,.rumdl_cache,.venv,__pycache__,build,dist,hack,uv.lock"

[tool.rumdl]
cache-dir = "local/.rumdl_cache"
disable = ["MD013"]
exclude = ["hack"]

[tool.rumdl.per-file-ignores]
".github/**/*.md" = ["MD041"]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"
cache-dir = "local/.ruff_cache"
extend-exclude = ["hack"]
force-exclude = true

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["ALL"]
ignore = [
    "COM812", "ISC001", # Conflict with formatter
    "CPY001", # Missing copyright notice at top of file
]
# Don't automatically remove `print`
# Stop automatically removing unused imports
unfixable = ["T201", "F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# Test files: allow assert (S101), magic values (PLR2004), private member access (SLF001),
# boolean test params (FBT001), and test docstring conventions (D1xx, D205, D401)
"local/tests/*.py" = ["D100", "D101", "D102", "D103", "D104", "D205", "D401", "FBT001", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
minversion = "9.0"
strict = true
cache_dir = "local/.pytest_cache"
python_files = "test_*.py"
pythonpath = ["."]
testpaths = ["local/tests"]
addopts = [
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "-m",
    "not slow and not heavy",
]
filterwarnings = [
    "error",
]
markers = [
    "slow: mark test as slow to run",
    "heavy: mark collision test as heavy (>=10M IDs)",
]

[tool.coverage.run]
branch = true
source_pkgs = ["cuid2"]

[tool.coverage.paths]
source = [
    "src/cuid2",
    "*/site-packages/cuid2",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.mypy]
cache_dir = "local/.mypy_cache"
files = ["."]
exclude = ["^build/", "^dist/", "^hack/"]
strict = true

[[tool.mypy.overrides]]
module = ["atheris", "keepachangelog"]
ignore_missing_imports = true

[tool.pyright]
exclude = ["build", "dist", "hack"]
strict = ["src"]

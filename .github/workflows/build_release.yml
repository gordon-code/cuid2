name: Manually Build Release
on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-lint-scan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # Needed to check out repository
      security-events: write # Needed by CodeQL to upload SARIF results
      actions: read # Needed by CodeQL to inspect workflow actions
    uses: ./.github/workflows/test_lint_scan.yml # zizmor: ignore[self-repository]

  build:
    name: Build Release
    needs: test-lint-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Needed to check out repository
      id-token: write # Needed to sign SLSA build provenance attestations
      attestations: write # Needed to persist SLSA build provenance attestations on GitHub
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test --no-install-project
      - name: Extract version and release notes from CHANGELOG.md
        id: version
        run: |
          uv run --no-sync python -m local.verify_release changelog \
            --notes-out "$RUNNER_TEMP/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: uv build --no-preview --no-sources --clear
      - name: Attest distribution build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          retention-days: 5
          if-no-files-found: error
      - name: Upload provenance bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 5
          if-no-files-found: error
      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 5
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Needed for OIDC trusted publishing and PEP 740 attestations
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    name: Create GitHub Release
    needs: [build, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Needed to create release tag and upload release assets
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Download provenance bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - name: Download release notes artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version from build job: $VERSION" >&2
            exit 1
          fi
          BUNDLE_FILE="$(find provenance -type f | head -n 1)"
          if [[ -z "$BUNDLE_FILE" ]]; then
            echo "Missing provenance bundle in provenance/" >&2
            exit 1
          fi
          cp "$BUNDLE_FILE" "provenance/cuid2-${VERSION}.sigstore.json"
          jq -ce '.dsseEnvelope' "$BUNDLE_FILE" > "provenance/cuid2-${VERSION}.intoto.jsonl"
          gh release create "v$VERSION" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes/release-notes.md \
            --latest \
            dist/*.whl dist/*.tar.gz \
            "provenance/cuid2-${VERSION}.sigstore.json" \
            "provenance/cuid2-${VERSION}.intoto.jsonl"

name: Manually Build Release
on:
  workflow_dispatch:
    inputs:
      versionNumber:
        description: "Version number of this release"
        required: true
        type: string
jobs:
  test-lint-scan:
    uses: ./.github/workflows/test_lint_scan.yml

  build_release:
    name: Build Release
    needs: test-lint-scan
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing to pypi
      id-token: write
      # This permissions is necessary for creating the GitHub release
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Build Release
        run: uv version --no-sync "$VERSION_NUMBER" && uv build
        env:
          VERSION_NUMBER: ${{ inputs.versionNumber }}
      - name: Publish Release
        run: uv publish
      - name: Create GitHub Release
        run: gh release create "v$VERSION_NUMBER" --latest --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NUMBER: ${{ inputs.versionNumber }}

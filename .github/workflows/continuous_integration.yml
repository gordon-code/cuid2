name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
  workflow_dispatch: {}
  schedule:
    # Weekly every Saturday at midnight
    - cron: '0 0 * * 6'

jobs:
  test-lint-scan:
    uses: ./.github/workflows/test_lint_scan.yml
